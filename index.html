<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page Dark Mode mit Check-Wary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <h1 class="mb-4">Willkommen zur Landing Page</h1>
        <div class="form-check form-check-warning">
            <input class="form-check-input" type="checkbox" value="" id="warnCheck">
            <label class="form-check-label text-warning" for="warnCheck">Warnung aktivieren</label>
        </div>
        <p class="mt-3 text-muted">Diese Seite nutzt Bootstrap im dunklen Design mit einer "Check-Wary"-Checkbox als Beispiel.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
